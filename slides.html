<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power of 2</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css?v=10">
  <script src="config.js?v=10"></script><script src="roster.js?v=10"></script><script src="manual.js?v=10"></script><script src="data.js?v=10"></script>
</head>
<body>
  <div class="deck" id="deck"></div>
  <div class="ctl">
    <button id="prev">‹ Prev</button>
    <select id="jump"></select>
    <button id="next">Next ›</button>
    <span class="pos" id="pos"></span>
  </div>

<script>
var valueLabels = { id:'valueLabels', afterDatasetsDraw:function (chart) {
  var ctx = chart.ctx;
  chart.data.datasets.forEach(function (ds, di) {
    var meta = chart.getDatasetMeta(di); if (meta.hidden) return;
    meta.data.forEach(function (bar, i) { var v = ds.data[i]; if (v == null) return;
      ctx.save(); ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(v, bar.x, bar.y - 4); ctx.restore(); });
  });
}};
function bar(canvas, labels, data, color) {
  return new Chart(canvas, { type:'bar', plugins:[valueLabels],
    data:{ labels:labels, datasets:[{ data:data, backgroundColor:color, borderRadius:4, maxBarThickness:70 }] },
    options:{ responsive:true, maintainAspectRatio:false, animation:false, plugins:{ legend:{display:false} },
      scales:{ x:{ ticks:{color:'#ddd',font:{size:13}}, grid:{display:false}, border:{color:'#fff'} },
               y:{ display:false, beginAtZero:true, grace:'25%' } } } });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function initials(n) { return n.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase() || '?'; }
function pic(m) {
  if (m.photo) return '<img class="pic" src="' + esc(m.photo) + '" onerror="this.outerHTML=\'<div class=pic>' + initials(m.name) + '</div>\'">';
  return '<div class="pic">' + initials(m.name) + '</div>';
}
function personCard(m, side) {
  if (!m || !m.name) return '<div class="person ' + side + '"><div class="pic">?</div><div class="nm na">Not yet paired</div></div>';
  return '<div class="person ' + side + '">' + pic(m) +
    '<div class="nm">' + esc(m.name) + '</div><div class="ch">' + esc(m.ch) + '</div>' +
    '<div class="dt"><b>Location:</b> ' + (esc(m.location) || '—') + '</div></div>';
}
function tick(v) { return v === true ? '✅' : v === false ? '❌' : '<span class="na">—</span>'; }

P2.load(function (M) {
  if (M.sample) { var b = document.createElement('div'); b.className = 'sample'; b.textContent = 'SAMPLE DATA — template preview'; document.body.appendChild(b); }
  var deck = document.getElementById('deck'), slides = [], charts = [];
  var W = M.weeks, labels = W.map(function (w) { return 'WK ' + w.wk; }), last = W[W.length - 1];

  // ---- Page 1: stage counting (Ushers Count), week by week ----
  var S = window.STAGE || { streams: [], weeks: [] }, SW = S.weeks || [], latest = SW[SW.length - 1] || {};
  var SC = { HGE: ['#1f5fff', '#8fb0ff'], Experience: ['#f5c518', '#fff0a8'] };
  function tot(w, st) { var x = w[st]; return x ? (x.podcast || 0) + (x.salvation || 0) : null; }
  var ph = latest.photos || {}; if (Array.isArray(ph)) ph = { Experience: ph };
  var pics = S.streams.map(function (st) { var list = (ph[st] || []).slice(0, 3);
    while (list.length < 3) list.push(null);
    return '<div class="pstream"><div class="plab" style="color:' + (SC[st] ? SC[st][0] : '#ccc') + '">' + esc(st) + '</div>' + list.map(function (p) {
      return p ? '<img src="' + esc(p) + '" onerror="this.outerHTML=\'<div class=ph>picture</div>\'">' : '<div class="ph">picture</div>'; }).join('') + '</div>'; });
  var legend = S.streams.map(function (st) { var c = SC[st] || ['#aaa', '#ddd'];
    return '<span><i class="sw" style="background:' + c[0] + '"></i> ' + esc(st) + ' · Podcast</span><span><i class="sw" style="background:' + c[1] + '"></i> ' + esc(st) + ' · Salvation</span>'; }).join('');
  var trows = SW.map(function (w) { var g = 0;
    var cells = S.streams.map(function (st) { var x = w[st], t = tot(w, st); if (t != null) g += t;
      return x ? '<td>' + x.podcast + '</td><td>' + x.salvation + '</td><td class="t">' + t + '</td>' : '<td class="na">—</td><td class="na">—</td><td class="na">—</td>'; }).join('');
    return '<tr><td class="w">' + esc(w.date) + '</td>' + cells + '<td class="g">' + g + '</td></tr>'; }).join('');
  slides.push({ title:'Stage counting', html:
    '<div class="head"><div class="name">Stage Counting on Sunday</div><div class="choir">Ushers Count</div></div>' +
    '<div class="stage2">' +
      '<div class="gwrap"><div class="legend">' + legend + '</div><div class="area"><canvas id="stagechart"></canvas></div></div>' +
      '<div class="pics">' + pics.join('') + '</div>' +
      '<div class="stbl"><table><thead><tr><th>Sunday</th>' + S.streams.map(function (st) { return '<th>' + esc(st) + ' Podcast</th><th>' + esc(st) + ' Salvation</th><th>' + esc(st) + ' Total</th>'; }).join('') + '<th>Grand total</th></tr></thead><tbody>' + trows + '</tbody></table></div>' +
    '</div>',
    draw:function () {
      var labels = SW.map(function (w) { return w.date; }), ds = [];
      S.streams.forEach(function (st) { var c = SC[st] || ['#aaa', '#ddd'];
        ds.push({ label: st + ' Podcast', data: SW.map(function (w) { return w[st] ? w[st].podcast : null; }), backgroundColor: c[0], borderRadius: 4, maxBarThickness: 60 });
        ds.push({ label: st + ' Salvation', data: SW.map(function (w) { return w[st] ? w[st].salvation : null; }), backgroundColor: c[1], borderRadius: 4, maxBarThickness: 60 }); });
      charts.push(new Chart(document.getElementById('stagechart'), { type:'bar', plugins:[valueLabels], data:{ labels:labels, datasets:ds },
        options:{ responsive:true, maintainAspectRatio:false, animation:false, plugins:{ legend:{display:false} },
          scales:{ x:{ ticks:{color:'#ddd',font:{size:13}}, grid:{display:false}, border:{color:'#fff'} }, y:{ display:false, beginAtZero:true, grace:'25%' } } } }));
    } });

  // ---- Page 2: weekend summary ----
  var k = last ? last.key : null, n = M.cgs.length, np = M.people;
  var ITEMS = [
    { f:'tue', lab:'Tuesday FLOW', c:'var(--green)', person:true },
    { f:'mgs', lab:'Meeting God Service', c:'var(--blue)', person:true },
    { f:'fri', lab:'Friday FLOW', c:'var(--green)', person:true },
    { f:'out', lab:'Saturday Outreaches', c:'var(--pink)', unit:'souls won' },
    { f:'sun', lab:'Sunday Attendance', c:'var(--sun)', unit:'people brought' }
  ];
  function tile(it) {
    if (k == null) return '<div class="kpi" style="--kc:' + it.c + '"><div class="lab">' + it.lab + '</div><div class="val">—</div></div>';
    var rep = M.reported(k, it.f).length, def = n - rep;
    var main = it.person ? M.total(k, it.f) + '<small> / ' + np + '</small>' : M.total(k, it.f);
    var sub = it.person ? 'CHs present' : it.unit;
    return '<div class="kpi" style="--kc:' + it.c + '"><div class="lab">' + it.lab + '</div><div class="val">' + main + '</div><div class="note">' + sub + '</div>' +
      '<div class="rep"><span class="ok">' + rep + ' CGs reported</span><span class="bad">' + def + ' not reported</span></div></div>';
  }
  slides.push({ title:'Weekend summary', html:
    '<div class="head"><div class="name">Summary of the Weekend</div><div class="choir">' + (last ? 'Week ' + last.wk + ' · ' + esc(last.label) : '') + '</div><div class="gov">' + n + ' CGs · ' + np + ' CHs</div></div>' +
    '<div class="grp"><span class="pill">Attendance — each CH counted</span></div><div class="kpis three">' + ITEMS.slice(0, 3).map(tile).join('') + '</div>' +
    '<div class="grp g2"><span class="pill">Reported by each CG</span></div><div class="kpis two">' + ITEMS.slice(3).map(tile).join('') + '</div>' });

  // ---- Page 3: defaulters ----
  function cgName(c) { return c.members.map(function (m) { return (m.name || '?').split(' ')[0]; }).join(' & '); }
  slides.push({ title:'Defaulters', html:
    '<div class="head"><div class="name">Defaulters</div><div class="choir">' + (last ? 'Week ' + last.wk + ' · ' + esc(last.label) : '') + '</div><div class="gov">CGs that did not report</div></div>' +
    '<div class="defs">' + ITEMS.map(function (it) { var list = k == null ? M.cgs : M.defaulters(k, it.f);
      return '<div class="def' + (list.length ? '' : ' ok') + '"><h4 style="color:' + it.c + '">' + it.lab + '<span>' + (list.length ? list.length + ' of ' + n : 'all reported ✓') + '</span></h4>' +
        (list.length ? '<ul>' + list.map(function (c) { return '<li><b>' + c.cg + '</b> ' + esc(cgName(c)) + '</li>'; }).join('') + '</ul>' : '') + '</div>'; }).join('') + '</div>' });

  // ---- Page 3+: one per CG ----
  M.cgs.forEach(function (c, i) {
    var out = W.map(function (w) { return M.get(c.cg, w.key, 'out'); }), sun = W.map(function (w) { return M.get(c.cg, w.key, 'sun'); });
    var mem = c.members.filter(function (m) { return m.ch; }), EV = ['tue', 'mgs', 'fri'];
    function first(m) { return esc((m.name || '').split(' ')[0]); }
    var rows = W.map(function (w) { return '<tr><td class="w">WK ' + w.wk + ' · ' + esc(w.label) + '</td>' + EV.map(function (f) {
      return mem.map(function (m, mi) { return '<td class="' + (mi === 0 ? 'first' : 'second') + '">' + tick(M.person(c.cg, w.key, f, m.ch)) + '</td>'; }).join(''); }).join('') + '</tr>'; }).join('');
    function cntP(f, ch) { return W.filter(function (w) { return M.person(c.cg, w.key, f, ch) === true; }).length; }
    var head2 = EV.map(function () { return mem.map(function (m, mi) { return '<th class="' + (mi === 0 ? 'first' : 'second') + ' sub">' + first(m) + '</th>'; }).join(''); }).join('');
    var totals = EV.map(function (f) { return mem.map(function (m, mi) { return '<td class="tot ' + (mi === 0 ? 'first' : 'second') + '">' + cntP(f, m.ch) + ' / ' + W.length + '</td>'; }).join(''); }).join('');
    slides.push({ title:c.cg + ' · ' + c.members.map(function (m) { return m.name || '?'; }).join(' & '), html:
      personCard(c.members[0], 'l') + personCard(c.members[1], 'r') +
      '<div class="head"><div class="name">Power of 2</div><div class="choir">' + esc(c.cg) + '</div><div class="gov">Governor: ' + esc(c.governor) + '</div></div>' +
      '<div class="graphs">' +
        '<div class="graph"><div class="cap"><span class="pill">Saturday Outreaches</span><span class="legend"><span><i class="sw" style="background:var(--pink)"></i> Souls won</span></span></div><div class="area"><canvas id="o' + i + '"></canvas></div></div>' +
        '<div class="graph"><div class="cap"><span class="pill">Sunday Attendance</span><span class="legend"><span><i class="sw" style="background:var(--sun)"></i> People brought</span></span></div><div class="area"><canvas id="s' + i + '"></canvas></div></div>' +
      '</div>' +
      '<div class="flow"><table><thead><tr><th rowspan="2">Week</th><th colspan="' + mem.length + '" class="grpth">Tuesday FLOW</th><th colspan="' + mem.length + '" class="grpth">Meeting God Service</th><th colspan="' + mem.length + '" class="grpth">Friday FLOW</th></tr><tr>' + head2 + '</tr></thead><tbody>' + rows +
        '<tr class="total"><td class="w">Total</td>' + totals + '</tr></tbody></table></div>',
      draw:function () { charts.push(bar(document.getElementById('o' + i), labels, out, '#e2574c')); charts.push(bar(document.getElementById('s' + i), labels, sun, '#f5c518')); } });
  });

  deck.innerHTML = slides.map(function (s, i) { return '<section class="slide" id="sl' + i + '">' + s.html + '</section>'; }).join('');
  var jump = document.getElementById('jump'); jump.innerHTML = slides.map(function (s, i) { return '<option value="' + i + '">' + (i + 1) + '. ' + esc(s.title) + '</option>'; }).join('');
  var cur = -1, drawn = {};
  function show(i) {
    i = Math.max(0, Math.min(slides.length - 1, i)); if (i === cur) return;
    if (cur >= 0) document.getElementById('sl' + cur).classList.remove('on');
    cur = i; document.getElementById('sl' + i).classList.add('on'); jump.value = i;
    document.getElementById('pos').textContent = (i + 1) + ' / ' + slides.length;
    if (slides[i].draw && !drawn[i]) { drawn[i] = 1; slides[i].draw(); }
    location.hash = i + 1;
  }
  document.getElementById('prev').onclick = function () { show(cur - 1); };
  document.getElementById('next').onclick = function () { show(cur + 1); };
  jump.onchange = function () { show(+jump.value); };
  document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === ' ') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
  window.addEventListener('hashchange', function () { show((parseInt(location.hash.slice(1), 10) || 1) - 1); });
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
}, function (e) { document.body.innerHTML = '<p style="padding:20px;color:#f88">' + e.message + '</p>'; });
</script>
</body>
</html>
